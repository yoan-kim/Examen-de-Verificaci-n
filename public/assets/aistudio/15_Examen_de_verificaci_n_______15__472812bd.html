<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신 43년(15차) 인 맞음 확인 시험 | Examen de Verificación</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* 초기 언어 선택 화면 */
    #lang-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #fff;
      text-align: center;
    }

    .lang-card {
      background: #ffffff;
      color: var(--gray-800);
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      max-width: 460px;
      width: 100%;
    }

    .lang-card h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--gray-800);
    }

    .lang-card p {
      font-size: 0.95rem;
      color: var(--gray-600);
      margin-bottom: 28px;
    }

    .lang-btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .lang-btn {
      padding: 18px 24px;
      font-size: 1.25rem;
      font-weight: 700;
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--primary);
      color: #fff;
    }

    .lang-btn.es {
      background: #fff;
      color: var(--primary);
    }

    .lang-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
    }

    /* 시험 메인 화면 */
    #app-screen {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      background: #fff;
      padding: 16px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .title-area h2 {
      font-size: 1.2rem;
      color: var(--gray-800);
    }

    .title-area span {
      font-size: 0.85rem;
      color: var(--gray-600);
    }

    .controls-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--gray-300);
      font-size: 0.85rem;
      background: var(--gray-50);
      cursor: pointer;
    }

    .btn-outline {
      padding: 8px 14px;
      border: 1px solid var(--gray-300);
      background: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--gray-600);
      transition: all 0.15s;
    }

    .btn-outline:hover {
      background: var(--gray-100);
      color: var(--gray-800);
    }

    /* 회차 탭 버튼 */
    .round-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .round-btn {
      padding: 12px 8px;
      border: 1px solid var(--gray-200);
      background: #fff;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gray-600);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .round-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .round-info-banner {
      background: var(--primary-light);
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #1e40af;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 문제 카드 */
    .question-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }

    .question-card.correct {
      border-color: var(--success);
    }

    .question-card.wrong {
      border-color: var(--danger);
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .q-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .q-badge.verse {
      background: #fef3c7;
      color: #b45309;
    }

    .q-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gray-800);
      margin-bottom: 16px;
      white-space: pre-line;
    }

    .sub-input-group {
      margin-bottom: 12px;
    }

    .sub-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: 6px;
    }

    .answer-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 48px;
      transition: border-color 0.15s;
    }

    .answer-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .q-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .btn-check-single {
      padding: 8px 16px;
      background: var(--gray-100);
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--gray-800);
    }

    .btn-check-single:hover {
      background: var(--gray-200);
    }

    /* 개별 채점 결과 박스 */
    .feedback-box {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .feedback-box.correct {
      display: block;
      background: var(--success-bg);
      color: #14532d;
      border: 1px solid #86efac;
    }

    .feedback-box.wrong {
      display: block;
      background: var(--danger-bg);
      color: #7f1d1d;
      border: 1px solid #fca5a5;
    }

    .model-answer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0,0,0,0.15);
      font-weight: 600;
      white-space: pre-line;
    }

    /* 하단 전체 채점 바 */
    .bottom-submit-area {
      background: #fff;
      padding: 20px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 24px;
    }

    .score-display {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gray-800);
    }

    .btn-primary {
      padding: 14px 28px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    @media (max-width: 600px) {
      .round-tabs {
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }
      .round-btn {
        font-size: 0.8rem;
        padding: 10px 4px;
      }
      .question-card {
        padding: 18px 14px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. 초기 언어 선택 화면 -->
  <div id="lang-screen">
    <div class="lang-card">
      <h1>신 43년(15차) 인 맞음 확인 시험</h1>
      <p>Examen de Verificación del Ser Sellado del Año 43 (15.º)<br/>언어를 선택해 주세요 / Seleccione su idioma</p>
      <div class="lang-btn-group">
        <button class="lang-btn" onclick="startApp('ko')">한국어</button>
        <button class="lang-btn es" onclick="startApp('es')">Español</button>
      </div>
    </div>
  </div>

  <!-- 2. 시험 화면 -->
  <div id="app-screen">
    <div class="top-bar">
      <div class="title-area">
        <h2 id="ui-title">신 43년(15차) 인 맞음 확인 시험 (B유형)</h2>
        <span id="ui-subtitle">범위: 복습, 계 21장, 핵심 성구</span>
      </div>
      <div class="controls-area">
        <select id="grading-mode" class="mode-select">
          <option value="standard" id="opt-standard">표준 채점 (띄어쓰기·어미 허용)</option>
          <option value="strict" id="opt-strict">엄격 채점 (토씨 100% 일치)</option>
        </select>
        <button class="btn-outline" id="btn-change-lang" onclick="goHome()">언어 변경 / Idioma</button>
      </div>
    </div>

    <!-- 상단 1~5회차 버튼 -->
    <div class="round-tabs" id="round-tabs"></div>

    <!-- 회차 설명 배너 및 문제 다시 섞기 버튼 -->
    <div class="round-info-banner">
      <span id="round-desc"></span>
      <button class="btn-outline" id="btn-reshuffle" onclick="loadRound(currentRound)">🔄 다시 섞기 / 초기화</button>
    </div>

    <!-- 문제 리스트 영역 -->
    <div id="questions-container"></div>

    <!-- 전체 채점 및 결과 -->
    <div class="bottom-submit-area">
      <div class="score-display" id="total-score-text">채점 전</div>
      <button class="btn-primary" id="btn-grade-all" onclick="gradeAll()">전체 채점하기</button>
    </div>
  </div>

    let currentLang = 'ko';
    let currentRound = 1;

    // 배열에서 n개 랜덤 추출
    function pickRandom(arr, count) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, count);
    }

    // 회차별 출제 문제 번호 구성
    function getQuestionIdsForRound(round) {
      // 모든 회차의 첫 번째 문제는 항상 10번 성구
      if (round === 1) {
        return [10];
      } else if (round === 2) {
        return [10, 1, 2, 3];
      } else if (round === 3) {
        const rand2 = pickRandom([1, 2, 3], 2);
        return [10, 4, 5, 6, ...rand2];
      } else if (round === 4) {
        const rand2 = pickRandom([1, 2, 3, 4, 5, 6], 2);
        return [10, 7, 8, 9, ...rand2];
      } else if (round === 5) {
        const rand5 = pickRandom([1, 2, 3, 4, 5, 6, 7, 8, 9], 5);
        return [10, ...rand5];
      }
      return [10];
    }

    function startApp(lang) {
      currentLang = lang;

      document.getElementById('app-screen').style.display = 'block';

    function updateStaticUIText() {

    function renderRoundTabs() {

    function loadRound(round) {

      container.innerHTML = '';

      activeQuestions.forEach((qObj, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${idx}`;

        const isVerse = qObj.id === 10;

        qObj.parts.forEach((part, pIdx) => {
          partsHTML += `
            <div class="sub-input-group">
              <label class="sub-label">${part.label}</label>

                class="answer-input"
                id="input-${idx}-${pIdx}"
                rows="${isVerse ? 3 : 2}"
                placeholder="${t.placeholder}"
              ></textarea>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="q-header">
            <span class="q-badge ${isVerse ? 'verse' : ''}">
              ${t.qOrderLabel(idx + 1, qObj.id)}
            </span>
          </div>
          <div class="q-title">${qObj.question}</div>
          ${partsHTML}
          <div class="q-actions">
            <button class="btn-check-single" onclick="gradeSingleQuestion(${idx})">${t.checkSingle}</button>
          </div>

        container.appendChild(card);

    }

    // 문자열 정규화: 공백, 특수문자 제거 및 스페인어 악센트 통일
    function normalizeText(str) {
      return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "") // 스페인어 강세 제거 후 비교
        .replace(/[\s,.\-~—:⋅·;'"“”‘’()\[\]¡!¿?]/g, "");
    }

    // 레벤슈타인 편집 거리 기반 문장 유사도 계산 (0 ~ 1)
    function getSimilarity(s1, s2) {
      if (s1 === s2) return 1.0;
      const len1 = s1.length;
      const len2 = s2.length;
      if (len1 === 0 || len2 === 0) return 0.0;

      const dp = Array.from({ length: len1 + 1 }, () => new Array(len2 + 1).fill(0));
      for (let i = 0; i <= len1; i++) dp[i][0] = i;
      for (let j = 0; j <= len2; j++) dp[0][j] = j;

      for (let i = 1; i <= len1; i++) {
        for (let j = 1; j <= len2; j++) {
          const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      const maxLen = Math.max(len1, len2);
      return (maxLen - dp[len1][len2]) / maxLen;
    }

    // 파트별 채점 함수
    function evaluatePart(userRaw, partObj, mode) {
      const normUser = normalizeText(userRaw);
      const normModel = normalizeText(partObj.answer);

      if (!normUser) {
        return { passed: false, similarity: 0, missing: partObj.keywords.map(g => g[0]) };
      }

      const similarity = getSimilarity(normUser, normModel);

      // 엄격 모드: 공백/문장부호 제외 100% 글자 일치 필요
      if (mode === 'strict') {
        return {
          passed: normUser === normModel,
          similarity: Math.round(similarity * 100),
          missing: []
        };
      }

      // 표준 모드: 모든 핵심 키워드 그룹 통과 + 전체 문장 유사도 78% 이상 (또는 짧은 답안은 키워드 100% + 유사도 72% 이상)
      const missing = [];
      for (const kwGroup of partObj.keywords) {
        const matched = kwGroup.some(kw => normUser.includes(normalizeText(kw)));
        if (!matched) {
          missing.push(kwGroup[0]);
        }
      }

      const minSim = normModel.length <= 10 ? 0.70 : 0.78;
      const passed = missing.length === 0 && similarity >= minSim;

      return {
        passed,
        similarity: Math.round(similarity * 100),
        missing
      };
    }

    function gradeSingleQuestion(qIdx) {
      const qObj = activeQuestions[qIdx];
      const mode = document.getElementById('grading-mode').value;
      const t = i18n[currentLang];

      let allPartsPassed = true;
      let totalSim = 0;
      let missingList = [];

      qObj.parts.forEach((part, pIdx) => {
        const userVal = document.getElementById(`input-${qIdx}-${pIdx}`).value;
        const res = evaluatePart(userVal, part, mode);
        if (!res.passed) allPartsPassed = false;
        totalSim += res.similarity;
        if (res.missing.length > 0) {
          missingList.push(...res.missing);
        }
      });

      const avgSim = Math.round(totalSim / qObj.parts.length);
      const card = document.getElementById(`q-card-${qIdx}`);
      const fb = document.getElementById(`feedback-${qIdx}`);

      card.classList.remove('correct', 'wrong');
      fb.classList.remove('correct', 'wrong');

      const modelText = qObj.parts
        .map(p => `${p.label ? `[${p.label}] ` : ''}${p.answer}`)
        .join('\n');

      let extraInfo = `<div style="margin-top:4px;font-size:0.82rem;">${t.similarityLabel} <strong>${avgSim}%</strong>`;
      if (missingList.length > 0 && mode === 'standard') {
        extraInfo += ` | ${t.missingKeywordsLabel} <strong>${missingList.join(', ')}</strong>`;
      }
      extraInfo += `</div>`;

      if (allPartsPassed) {
        card.classList.add('correct');
        fb.classList.add('correct');
        fb.innerHTML = `
          <div><strong>${t.correctMsg}</strong></div>
          ${extraInfo}
          <div class="model-answer">${t.modelAnswerLabel}\n${modelText}</div>
        `;
      } else {
        card.classList.add('wrong');
        fb.classList.add('wrong');
        fb.innerHTML = `
          <div><strong>${t.wrongMsg}</strong></div>
          ${extraInfo}
          <div class="model-answer">${t.modelAnswerLabel}\n${modelText}</div>
        `;
      }

      return allPartsPassed;
    }

    function gradeAll() {
      let passedCount = 0;
      for (let i = 0; i < activeQuestions.length; i++) {
        if (gradeSingleQuestion(i)) {
          passedCount++;
        }
      }
      const t = i18n[currentLang];
      document.getElementById('total-score-text').textContent =
        t.totalScore(passedCount, activeQuestions.length);
    }
